{% extends 'base.html' %}
{% block title %}login{% endblock %}

{% block content %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header text-center bg-primary text-white">
                        <h4>Login</h4>
                    </div>
                    <div class="card-body">
                        <div class="card-body">
                            <div class="card-body">


                                {% if messages %}
                                <div class="mt-3">
                                    {% for message in messages %}
                                    <div class="alert alert-danger alert-dismissible fade show shadow-sm d-flex align-items-center"
                                        role="alert">
                                        <i class="bi bi-info-circle-fill me-2 fs-5 text-info"></i>
                                        <div>{{ message }}</div>
                                        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"
                                            aria-label="Close"></button>
                                    </div>
                                    {% endfor %}
                                </div>
                                {% endif %}
                                <form method="POST">

                                    <!-- Include CSRF token here if using Django -->
                                    {% csrf_token %}

                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="username" name="username" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <input type="password" class="form-control" id="password" name="password"
                                            required>
                                    </div>

                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary">Login</button>
                                    </div>
                                </form>
                            </div>
                            <div class="card-footer text-center">
                                <a href="{% url 'register' %}">New user? Register here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bootstrap JS (Optional for form interactivity) -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
{% endblock %}
