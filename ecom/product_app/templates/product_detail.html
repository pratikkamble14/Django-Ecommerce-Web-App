{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <!-- Image on the left -->
        <div class="col-md-6 text-center">
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid rounded shadow" style="max-height: 400px;">
        </div>

        <!-- Details on the right -->
        <div class="col-md-6">
            <h2>{{ product.name }}</h2>
            <p class="text-muted">{{ product.description }}</p>
            <h4 class="text-success">₹{{ product.price }}</h4>
            <p><strong>Available Stock:</strong> {{ product.stock }}</p>

            <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary btn-lg mt-3">
                Add to Cart
            </a>
        </div>
    </div>
</div>
{% endblock %}
