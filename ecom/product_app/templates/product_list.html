{% extends 'base.html' %}
{% load static %}
{% block title %}Product List{% endblock %}
{% block content %}

<div class="container mt-4">
    <!-- <h2 class="mb-4">Products</h2> -->

    <!-- Filter & Search -->
    <form method="get" class="row mb-4">
        <div class="col-md-4">
            <select name="category" class="form-select">
                <option value="">All Categories</option>
                {% for cat in categories %}
                <option value="{{ cat.id }}" {% if selected_category == cat.id|stringformat:"s" %}selected{% endif %}>{{ cat.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- <div class="col-md-4">
            <input type="text" name="q" placeholder="Search..." value="{{ search_query }}" class="form-control">
        </div> -->

        <div class="col-md-4">
            <button type="submit" class="btn btn-primary w-100">Apply Filters</button>
        </div>
    </form>

    <!-- Product Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-5 g-4">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 shadow-sm">
                <img src="{{ product.image.url }}" class="card-img-top" style="height:200px;object-fit:cover;">
                <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ product.name|truncatechars:25 }}</h5>
                    <p class="card-text">₹{{ product.price }}</p>
                    <div class="mt-auto">
                        <a href="{% url 'product_detail' product.id %}" class="btn btn-outline-primary w-100 mb-2">View Details</a>
                        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success w-100">Add to Cart</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
